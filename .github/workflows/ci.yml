name: ci

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        # --locked-mode: el restore falla si packages.lock.json no coincide con lo declarado.
        # Sin esto, una dependencia transitiva podria cambiar entre CI y local sin avisar.
        run: dotnet restore DevStatusCenter.slnx --locked-mode
      - name: Build
        run: dotnet build DevStatusCenter.slnx -c Release --no-restore
      - name: Test
        run: dotnet test DevStatusCenter.slnx -c Release --no-build --collect:"XPlat Code Coverage"
